server {
    listen 80;
    server_name localhost; # ou o IP da máquina, ex: 192.168.1.50

    # Limite máximo de envio (segurança)
    client_max_body_size 10M;

    # Encaminha todas as requisições para a aplicação Node.js
    location / {
        proxy_pass http://127.0.0.1:3000;
        
        # Cabeçalhos essenciais para repassar o IP real do cliente para o Node.js:
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Suporte a WebSockets e conexões persistentes (HTTP 1.1)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Timeouts de conexão
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Otimização opcional: Nginx servindo imagens diretamente com cache
    location /assets/ {
        # Substitua pelo caminho absoluto da pasta assets no seu sistema:
        # No Windows: alias C:/Users/RafaelLuizdaSilva/Projetos/dinamica_quinshing/assets/;
        # No Linux: alias /var/www/dinamica_quinshing/assets/;
        proxy_pass http://127.0.0.1:3000/assets/;
        expires 7d;
        add_header Cache-Control "public, no-transform";
    }
}